<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestBuilder - AI Test Automation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      background: #f8f9fa;
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .section {
      margin-bottom: 20px;
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .section h3 {
      color: #333;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    .status.recording {
      background: #e8f5e8;
      color: #2d5a2d;
      border: 1px solid #c3e6c3;
    }

    .status.idle {
      background: #f0f0f0;
      color: #666;
      border: 1px solid #ddd;
    }

    .status-icon {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .status.recording .status-icon {
      background: #28a745;
      animation: pulse 2s infinite;
    }

    .status.idle .status-icon {
      background: #6c757d;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      min-width: 120px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #5a6fd8;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #c0392b;
    }

    .btn-success {
      background: #28a745;
      color: white;
    }

    .btn-success:hover:not(:disabled) {
      background: #218838;
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #5a6268;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }

    .stat-item {
      text-align: center;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 6px;
      border: 1px solid #e9ecef;
    }

    .stat-number {
      font-size: 20px;
      font-weight: 600;
      color: #667eea;
      display: block;
    }

    .stat-label {
      font-size: 12px;
      color: #6c757d;
      margin-top: 4px;
    }

    .footer {
      text-align: center;
      padding: 16px;
      border-top: 1px solid #e9ecef;
      background: white;
      margin-top: auto;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-size: 12px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .actions-log {
      max-height: 150px;
      overflow-y: auto;
      background: #f8f9fa;
      border-radius: 4px;
      padding: 8px;
      font-size: 12px;
      border: 1px solid #e9ecef;
    }

    .action-item {
      padding: 4px 0;
      border-bottom: 1px solid #e9ecef;
    }

    .action-item:last-child {
      border-bottom: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🧪 TestBuilder AI</h1>
    <p>Automated test generation with AI</p>
  </div>

  <div class="content">
    <!-- Status Section -->
    <div class="section">
      <div id="status" class="status idle">
        <div class="status-icon"></div>
        <span id="statusText">Ready to record</span>
      </div>
      
      <div class="button-group">
        <button id="startRecord" class="btn btn-primary">
          🎬 Start Recording
        </button>
        <button id="stopRecord" class="btn btn-danger" disabled>
          ⏹️ Stop Recording
        </button>
      </div>
    </div>

    <!-- Actions Section -->
    <div class="section">
      <h3>📋 Test Actions</h3>
      <div class="stats">
        <div class="stat-item">
          <span id="actionCount" class="stat-number">0</span>
          <div class="stat-label">Actions Recorded</div>
        </div>
        <div class="stat-item">
          <span id="sessionTime" class="stat-number">00:00</span>
          <div class="stat-label">Session Time</div>
        </div>
      </div>
      
      <div id="actionsLog" class="actions-log" style="margin-top: 12px;">
        <div class="action-item">No actions recorded yet</div>
      </div>
    </div>

    <!-- Export Section -->
    <div class="section">
      <h3>🚀 Export & Generate</h3>
      <div class="button-group">
        <button id="generateAI" class="btn btn-success" disabled>
          🤖 Generate with AI
        </button>
        <button id="exportPlaywright" class="btn btn-secondary" disabled>
          📝 Export Playwright
        </button>
      </div>
      <div class="button-group" style="margin-top: 8px;">
        <button id="saveTest" class="btn btn-secondary" disabled>
          💾 Save Test
        </button>
        <button id="viewTests" class="btn btn-secondary">
          👁️ View Tests
        </button>
      </div>
      <!-- Resultado generado por IA -->
      <div id="aiResultSection" style="margin-top:16px; display:none;">
        <h4 style="margin-bottom:8px; color:#667eea;">🤖 Test generado por IA</h4>
        <textarea id="aiResult" style="width:100%; min-height:120px; font-family:monospace; font-size:13px; border-radius:6px; border:1px solid #e9ecef; padding:8px; resize:vertical;" readonly></textarea>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Processing...</div>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="openConfig">⚙️ Settings</a> | 
    <a href="#" id="viewLogs">📊 Debug Logs</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
