version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-tests-analytics
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Mexico_City
      - N8N_USER_FOLDER=/home/node/.n8n
      - DB_TYPE=sqlite
      - DB_SQLITE_DATABASE=/home/node/.n8n/database.sqlite
      - N8N_ENCRYPTION_KEY=TestsAnalytics2025SecureKey123456789
      - GEMINI_API_KEY=AIzaSyCzJ4xs0SjfvlYMvSBkjauJ9s5n_0r6F24
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-data:/data
    networks:
      - n8n-network

volumes:
  n8n_data:

networks:
  n8n-network:
    driver: bridge